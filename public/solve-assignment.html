<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solve Assignment — CourseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/javascript-lint.min.js"></script>
<style>
  html, body { height: 100%; }
  .solve-layout { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 60px); }
  .problem-panel { overflow-y: auto; padding: 26px 30px; border-right: 1px solid var(--border); background: var(--bg-panel); }
  .editor-panel { display: flex; flex-direction: column; }
  .editor-topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
  .lang-pill { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); background: var(--bg-elevated); padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border-bright); }
  .CodeMirror { flex: 1; height: 100%; font-family: var(--mono); font-size: 0.9rem; }
  .editor-mid { flex: 1; min-height: 260px; }
  .result-tabs { display: flex; gap: 4px; padding: 10px 16px 0; background: var(--bg-panel); border-top: 1px solid var(--border); }
  .result-tab { padding: 8px 16px; font-family: var(--mono); font-size: 0.82rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .result-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .result-body { background: var(--bg-panel); padding: 16px; min-height: 130px; max-height: 220px; overflow-y: auto; font-family: var(--mono); font-size: 0.82rem; }
  .test-case-row { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border-bright); }
  .test-case-row.pass { border-color: var(--green); background: var(--green-dim); }
  .test-case-row.fail { border-color: var(--red); background: var(--red-dim); }
  .editor-actions { display: flex; gap: 10px; padding: 12px 16px; background: var(--bg-panel); border-top: 1px solid var(--border); }
  @media (max-width: 900px) { .solve-layout { grid-template-columns: 1fr; height: auto; } .problem-panel { border-right: none; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>

<div id="navbar" class="navbar"></div>

<div class="solve-layout">
  <div class="problem-panel">
    <span class="eyebrow" id="courseNameLabel">Course</span>
    <h1 id="problemTitle" style="font-size:1.4rem;">Loading…</h1>
    <p style="color:var(--muted);font-size:0.85rem;font-family:var(--mono);" id="dueDateLabel"></p>
    <p id="problemDesc" style="margin-top:16px;white-space:pre-wrap;"></p>
    <div id="testCasesPreview" style="margin-top:20px;"></div>
  </div>

  <div class="editor-panel">
    <div class="editor-topbar">
      <span class="lang-pill" id="langPill">javascript</span>
      <span id="autoGradeNote" style="font-size:0.78rem;color:var(--muted);font-family:var(--mono);"></span>
    </div>
    <div class="editor-mid" id="editorHolder"></div>
    <div class="result-tabs">
      <div class="result-tab active" data-tab="testcase">Testcase</div>
      <div class="result-tab" data-tab="result">Test Result</div>
    </div>
    <div class="result-body" id="resultBody">
      <p style="color:var(--muted);">Click "Run" to test your code, or "Submit" when you're confident.</p>
    </div>
    <div class="editor-actions">
      <button class="btn btn-outline btn-block" id="runBtn">▶ Run</button>
      <button class="btn btn-primary btn-block" id="submitBtn">Submit</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
renderNavbar();
const user = requireRole("student");

let editor = null;
let assignment = null;
let lastResults = null;

(async () => {
  const assignmentId = new URLSearchParams(window.location.search).get("id");
  if (!assignmentId) { document.body.innerHTML = "<p style='padding:30px;'>No assignment specified.</p>"; return; }

  try {
    assignment = await fetch(`/api/assignments/${assignmentId}`).then(r => r.json());
    if (assignment.error) throw new Error(assignment.error);
  } catch (err) {
    document.body.innerHTML = `<p style='padding:30px;'>Assignment not found.</p>`;
    return;
  }

  document.getElementById("problemTitle").textContent = assignment.title;
  document.getElementById("problemDesc").textContent = assignment.description;
  document.getElementById("dueDateLabel").textContent = "Due " + new Date(assignment.dueDate).toLocaleDateString();
  document.getElementById("langPill").textContent = assignment.language;

  const isStdio = assignment.language === "python" || assignment.language === "java";
  function fmtVal(v) {
    return isStdio ? String(v).replace(/</g, "&lt;") : JSON.stringify(v);
  }

  if (assignment.autoGraded) {
    document.getElementById("autoGradeNote").textContent = "✓ auto-graded — wrong answers can't be submitted";
    document.getElementById("testCasesPreview").innerHTML = `
      <label>Sample Test Cases</label>
      ${assignment.testCases.map((tc, i) => `
        <div class="test-case-row" style="border-color:var(--border-bright);background:var(--bg-elevated);">
          <strong>${isStdio ? "Stdin" : "Input"} ${i+1}:</strong> <pre style="display:inline;white-space:pre-wrap;">${fmtVal(tc.input)}</pre><br>
          <strong>Expected Output:</strong> <pre style="display:inline;white-space:pre-wrap;">${fmtVal(tc.expectedOutput)}</pre>
        </div>
      `).join("")}
    `;
  } else {
    document.getElementById("autoGradeNote").textContent = "reviewed manually by your instructor";
    document.getElementById("runBtn").style.display = "none";
  }

  // Load existing submission if the student already has one, else use starter code
  let initialCode = assignment.starterCode || "";
  try {
    const mine = await api.getMySubmissions(user.email);
    const existing = mine.find(s => s.assignmentId === assignment._id);
    if (existing) initialCode = existing.content;
  } catch (e) { /* fine, just use starter code */ }

  const mode = assignment.language === "python" ? "python" : assignment.language === "java" ? "text/x-java" : "javascript";
  const holder = document.getElementById("editorHolder");

  if (typeof CodeMirror !== "undefined") {
    editor = CodeMirror(holder, {
      value: initialCode,
      mode, theme: "dracula", lineNumbers: true,
      gutters: mode === "javascript" ? ["CodeMirror-lint-markers"] : [],
      lint: mode === "javascript",
    });
  } else {
    holder.innerHTML = `<textarea id="editorFallback" style="width:100%;height:100%;background:var(--bg-elevated);color:var(--text);border:none;font-family:var(--mono);padding:14px;">${initialCode}</textarea>`;
  }

  function getCode() {
    return editor ? editor.getValue() : (document.getElementById("editorFallback")?.value || "");
  }

  document.querySelectorAll(".result-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".result-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderResultBody(tab.dataset.tab);
    });
  });

  function renderResultBody(which) {
    const body = document.getElementById("resultBody");
    if (which === "testcase") {
      body.innerHTML = assignment.autoGraded
        ? assignment.testCases.map((tc, i) => `<div class="test-case-row" style="border-color:var(--border-bright);background:var(--bg-elevated);"><strong>Test ${i+1}:</strong> ${fmtVal(tc.input)} → expects ${fmtVal(tc.expectedOutput)}</div>`).join("")
        : `<p style="color:var(--muted);">This assignment is reviewed manually — there's no automated test case checking.</p>`;
    } else {
      if (!lastResults) { body.innerHTML = `<p style="color:var(--muted);">Run your code first to see results here.</p>`; return; }
      body.innerHTML = lastResults.map((r, i) => `
        <div class="test-case-row ${r.passed ? 'pass' : 'fail'}">
          <strong>Test ${i+1}: ${r.passed ? '✓ Passed' : '✗ Failed'}</strong><br>
          Input: ${fmtVal(r.input)}<br>
          Expected: ${fmtVal(r.expectedOutput)}<br>
          ${r.error ? `Error: ${String(r.error).replace(/</g,"&lt;")}` : `Got: ${fmtVal(r.actualOutput)}`}
        </div>
      `).join("");
    }
  }

  document.getElementById("runBtn").addEventListener("click", async () => {
    const code = getCode();
    if (!code.trim()) { alert("Write some code first."); return; }
    const runBtn = document.getElementById("runBtn");
    runBtn.disabled = true;
    runBtn.textContent = "Running...";
    try {
      const res = await fetch(`/api/assignments/${assignment._id}/run`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      lastResults = data.results;
      document.querySelectorAll(".result-tab").forEach(t => t.classList.remove("active"));
      document.querySelector('.result-tab[data-tab="result"]').classList.add("active");
      renderResultBody("result");
    } catch (err) {
      alert(err.message);
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "▶ Run";
    }
  });

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const code = getCode();
    if (!code.trim()) { alert("Write some code first."); return; }
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    try {
      const res = await fetch(`/api/assignments/${assignment._id}/submissions`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentEmail: user.email, content: code }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (data.testResults) {
          lastResults = data.testResults;
          document.querySelectorAll(".result-tab").forEach(t => t.classList.remove("active"));
          document.querySelector('.result-tab[data-tab="result"]').classList.add("active");
          renderResultBody("result");
        }
        alert(data.error || "Submission rejected — check the Test Result tab.");
        return;
      }
      alert("Submitted successfully!" + (assignment.autoGraded ? " All test cases passed." : ""));
      window.location.href = "student-dashboard.html";
    } catch (err) {
      alert(err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  renderResultBody("testcase");
})();
</script>
</body>
</html>
