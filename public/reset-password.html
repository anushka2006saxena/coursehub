<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — CourseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar" class="navbar"></div>

<div class="form-card">
  <div id="formArea">
    <h2 style="text-align:center;">Set a new password</h2>
    <form id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" required placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" required placeholder="Re-enter your new password">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Update Password</button>
    </form>
    <div id="messageBox" style="display:none;margin-top:16px;padding:14px;border-radius:8px;font-size:0.9rem;"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  renderNavbar();

  const token = new URLSearchParams(window.location.search).get("token");
  const messageBox = document.getElementById("messageBox");
  const submitBtn = document.getElementById("submitBtn");

  function showMessage(text, kind) {
    messageBox.style.display = "block";
    messageBox.style.background = kind === "success" ? "#e4f4e8" : "#fbe7e5";
    messageBox.style.color = kind === "success" ? "#2c6b41" : "#9c3a2b";
    messageBox.textContent = text;
  }

  if (!token) {
    document.getElementById("formArea").innerHTML = `
      <h2 style="text-align:center;">Invalid link</h2>
      <p style="color:var(--muted);text-align:center;">This password reset link is missing its token. Please request a new one.</p>
      <a href="forgot-password.html" class="btn btn-primary btn-block">Request New Link</a>
    `;
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      showMessage("Passwords don't match.", "error");
      return;
    }

    submitBtn.disabled = true;
    try {
      const result = await api.resetPassword(token, newPassword);
      showMessage(result.message, "success");
      document.getElementById("resetForm").style.display = "none";
      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    } catch (err) {
      showMessage(err.message, "error");
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
