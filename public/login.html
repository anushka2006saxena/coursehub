<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — CourseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar" class="navbar"></div>

<div class="form-card" id="formCard">
  <h2 id="formTitle" style="text-align:center;">Log in to CourseHub</h2>

  <div class="role-toggle">
    <button type="button" id="roleStudent" class="active">Student</button>
    <button type="button" id="roleInstructor">Instructor</button>
    <button type="button" id="roleAdmin">Admin</button>
  </div>

  <form id="authForm">
    <div class="form-group" id="nameGroup" style="display:none;">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="e.g. Anushka Saxena">
    </div>
    <div class="form-group" id="classGroup" style="display:none;">
      <label>Class</label>
      <input type="text" id="studentClass" placeholder="e.g. B.Tech CSE, 5th Sem">
    </div>
    <div class="form-group" id="enrollmentGroup" style="display:none;">
      <label>Enrollment Number</label>
      <input type="text" id="enrollmentNumber" placeholder="e.g. ADTU2023CS045">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Log In</button>
  </form>

  <p style="text-align:center;font-size:0.85rem;margin-top:12px;">
    <a href="forgot-password.html">Forgot password?</a>
  </p>

  <div id="messageBox" style="display:none;margin-top:16px;padding:14px;border-radius:8px;font-size:0.9rem;"></div>

  <p style="text-align:center;font-size:0.85rem;margin-top:16px;">
    <a href="#" id="toggleMode">New here? Create an account</a>
  </p>
</div>

<div class="form-card" id="otpCard" style="display:none;">
  <h2 style="text-align:center;">Verify your email</h2>
  <p style="text-align:center;color:var(--muted);font-size:0.9rem;" id="otpSubtext"></p>

  <div class="form-group">
    <label>6-digit code</label>
    <input type="text" id="otpInput" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:8px;font-size:1.4rem;font-family:var(--mono);">
  </div>
  <button class="btn btn-primary btn-block" id="verifyOtpBtn">Verify</button>

  <div id="otpMessageBox" style="display:none;margin-top:16px;padding:14px;border-radius:8px;font-size:0.9rem;"></div>

  <p style="text-align:center;font-size:0.85rem;margin-top:16px;">
    Didn't get it? <a href="#" id="resendOtpLink">Resend code</a>
  </p>
  <p style="text-align:center;font-size:0.85rem;">
    <a href="#" id="backToLogin">&larr; Back to login</a>
  </p>
</div>

<script src="app.js"></script>
<script>
  renderNavbar();

  let role = "student";
  let mode = "login";
  let lastAttemptEmail = "";

  const roleStudentBtn = document.getElementById("roleStudent");
  const roleInstructorBtn = document.getElementById("roleInstructor");
  const roleAdminBtn = document.getElementById("roleAdmin");
  const nameGroup = document.getElementById("nameGroup");
  const formTitle = document.getElementById("formTitle");
  const submitBtn = document.getElementById("submitBtn");
  const toggleMode = document.getElementById("toggleMode");
  const messageBox = document.getElementById("messageBox");

  function updateUI() {
    roleStudentBtn.classList.toggle("active", role === "student");
    roleInstructorBtn.classList.toggle("active", role === "instructor");
    roleAdminBtn.classList.toggle("active", role === "admin");
    nameGroup.style.display = mode === "register" ? "block" : "none";
    const showStudentFields = mode === "register" && role === "student";
    document.getElementById("classGroup").style.display = showStudentFields ? "block" : "none";
    document.getElementById("enrollmentGroup").style.display = showStudentFields ? "block" : "none";
    formTitle.textContent = (mode === "register" ? "Create your " : "Log in to your ") + role + " account";
    submitBtn.textContent = mode === "register" ? "Create Account" : "Log In";
    toggleMode.textContent = mode === "register" ? "Already have an account? Log in" : "New here? Create an account";
    messageBox.style.display = "none";
  }

  function showMessage(text, kind) {
    messageBox.style.display = "block";
    messageBox.style.background = kind === "success" ? "#e4f4e8" : "#fbe7e5";
    messageBox.style.color = kind === "success" ? "#2c6b41" : "#9c3a2b";
    messageBox.textContent = text;
  }

  roleStudentBtn.addEventListener("click", () => { role = "student"; updateUI(); });
  roleInstructorBtn.addEventListener("click", () => { role = "instructor"; updateUI(); });
  roleAdminBtn.addEventListener("click", () => { role = "admin"; updateUI(); });
  toggleMode.addEventListener("click", (e) => {
    e.preventDefault();
    mode = mode === "login" ? "register" : "login";
    updateUI();
  });

  document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const name = document.getElementById("name").value.trim();
    lastAttemptEmail = email;
    submitBtn.disabled = true;

    try {
      if (mode === "register") {
        const studentClass = document.getElementById("studentClass").value.trim();
        const enrollmentNumber = document.getElementById("enrollmentNumber").value.trim();
        const result = await api.register({ name, email, password, role, studentClass, enrollmentNumber });
        showOtpScreen(result.email, result.role, result.devOtp);
      } else {
        const user = await api.login({ email, password, role });
        session.set(user);
        goToDashboard(user.role);
      }
    } catch (err) {
      if (err.otpRequired) {
        // Account exists but hasn't verified yet — send them straight to the OTP screen.
        showOtpScreen(err.email, err.role);
      } else {
        showMessage(err.message, "error");
      }
    } finally {
      submitBtn.disabled = false;
    }
  });

  function goToDashboard(userRole) {
    window.location.href = userRole === "student" ? "student-dashboard.html" : userRole === "instructor" ? "instructor-dashboard.html" : "admin-dashboard.html";
  }

  // ---------- OTP screen ----------
  const formCard = document.getElementById("formCard");
  const otpCard = document.getElementById("otpCard");
  const otpMessageBox = document.getElementById("otpMessageBox");
  let otpEmail = "", otpRole = "";

  function showOtpScreen(email, roleForOtp, devOtp) {
    otpEmail = email;
    otpRole = roleForOtp;
    formCard.style.display = "none";
    otpCard.style.display = "block";
    document.getElementById("otpSubtext").textContent = `We sent a 6-digit code to ${email}.`;
    document.getElementById("otpInput").value = "";
    otpMessageBox.style.display = "none";
    if (devOtp) {
      showOtpMessage(`No email server is configured yet — here's your code directly: ${devOtp}`, "success");
    }
    document.getElementById("otpInput").focus();
  }

  function showOtpMessage(text, kind) {
    otpMessageBox.style.display = "block";
    otpMessageBox.style.background = kind === "success" ? "#e4f4e8" : "#fbe7e5";
    otpMessageBox.style.color = kind === "success" ? "#2c6b41" : "#9c3a2b";
    otpMessageBox.textContent = text;
  }

  document.getElementById("verifyOtpBtn").addEventListener("click", async () => {
    const otp = document.getElementById("otpInput").value.trim();
    if (otp.length !== 6) {
      showOtpMessage("Enter the full 6-digit code.", "error");
      return;
    }
    const btn = document.getElementById("verifyOtpBtn");
    btn.disabled = true;
    try {
      const user = await api.verifyOtp(otpEmail, otpRole, otp);
      session.set(user);
      goToDashboard(user.role);
    } catch (err) {
      showOtpMessage(err.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("resendOtpLink").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      const result = await api.resendOtp(otpEmail, otpRole);
      showOtpMessage(result.devOtp ? `New code (no email server configured): ${result.devOtp}` : result.message, "success");
    } catch (err) {
      showOtpMessage(err.message, "error");
    }
  });

  document.getElementById("backToLogin").addEventListener("click", (e) => {
    e.preventDefault();
    otpCard.style.display = "none";
    formCard.style.display = "block";
    mode = "login";
    updateUI();
  });

  updateUI();
</script>
</body>
</html>
