<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password — CourseHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar" class="navbar"></div>

<div class="form-card">
  <h2 style="text-align:center;">Reset your password</h2>
  <p style="text-align:center;color:var(--muted);font-size:0.9rem;">Enter your email and we'll send you a link to reset it.</p>

  <div class="role-toggle">
    <button type="button" id="roleStudent" class="active">Student</button>
    <button type="button" id="roleInstructor">Instructor</button>
    <button type="button" id="roleAdmin">Admin</button>
  </div>

  <form id="forgotForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Send Reset Link</button>
  </form>

  <div id="messageBox" style="display:none;margin-top:16px;padding:14px;border-radius:8px;font-size:0.9rem;"></div>

  <p style="text-align:center;font-size:0.85rem;margin-top:16px;">
    <a href="login.html">Back to Login</a>
  </p>
</div>

<script src="app.js"></script>
<script>
  renderNavbar();

  let role = "student";
  const roleStudentBtn = document.getElementById("roleStudent");
  const roleInstructorBtn = document.getElementById("roleInstructor");
  const roleAdminBtn = document.getElementById("roleAdmin");
  const messageBox = document.getElementById("messageBox");
  const submitBtn = document.getElementById("submitBtn");

  function setRole(r) {
    role = r;
    roleStudentBtn.classList.toggle("active", role === "student");
    roleInstructorBtn.classList.toggle("active", role === "instructor");
    roleAdminBtn.classList.toggle("active", role === "admin");
  }
  roleStudentBtn.addEventListener("click", () => setRole("student"));
  roleInstructorBtn.addEventListener("click", () => setRole("instructor"));
  roleAdminBtn.addEventListener("click", () => setRole("admin"));

  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    submitBtn.disabled = true;

    try {
      const result = await api.forgotPassword(email, role);
      messageBox.style.display = "block";
      messageBox.style.background = "#e4f4e8";
      messageBox.style.color = "#2c6b41";
      messageBox.textContent = result.message;
      document.getElementById("forgotForm").reset();
    } catch (err) {
      messageBox.style.display = "block";
      messageBox.style.background = "#fbe7e5";
      messageBox.style.color = "#9c3a2b";
      messageBox.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
